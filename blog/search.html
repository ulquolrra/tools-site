    <script>
        // 博客文章数据
        const blogArticles = [
            {
                title: '14个在线工具的深度使用场景和进阶技巧',
                url: '/blog/post/tool-usage-guide.html',
                excerpt: '本文详细介绍了我们工具站中14个工具的实战应用场景，包括JSON格式化、Base64编解码、时间戳转换等工具的高级用法和最佳实践。每个工具都配有实际的代码示例和常见问题解答。',
                date: '2026-08-20',
                views: 234,
                tags: ['工具使用', 'JSON', 'Base64', '时间戳', '编码', '解码', '工具', 'Web开发'],
                category: '工具使用'
            },
            {
                title: '如何通过内容优化让工具站顺利通过AdSense审核',
                url: '/blog/post/adsense-approval-guide.html',
                excerpt: '分享我们解决Google AdSense\"低质量内容\"拒绝的完整经验，包括内容丰富化、SEO优化、用户体验提升等具体方法。',
                date: '2026-08-20',
                views: 189,
                tags: ['AdSense', 'SEO', '工具站', '内容优化', '网站变现', 'SEO优化'],
                category: 'SEO优化'
            },
            {
                title: 'YAML vs JSON：配置文件格式选择的完整指南',
                url: '/blog/post/json-yaml-comparison.html',
                excerpt: '深入分析YAML和JSON两种配置文件格式的优缺点、适用场景和转换技巧。帮助开发者在不同项目中选择最合适的格式，提升开发效率。',
                date: '2026-08-20',
                views: 156,
                tags: ['YAML', 'JSON', '配置文件', 'Web开发', '数据处理'],
                category: 'Web开发'
            }
        ];

        // 获取URL参数
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name) || '';
        }

        // 高亮关键词
        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="search-highlight">$1</span>');
        }

        // 显示搜索结果
        function displayResults(results, query) {
            const resultsContainer = document.getElementById('searchResults');
            const statsContainer = document.getElementById('searchStats');
            const searchInput = document.getElementById('searchQuery');

            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="col-12">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body text-center no-results">
                                <i class="fas fa-search fa-3x text-muted mb-3"></i>
                                <h5>没有找到相关文章</h5>
                                <p class="mb-3">没有找到与 "${query}" 相关的内容</p>
                                <p class="text-muted small">建议：尝试其他关键词，或<a href="/blog" class="text-primary">浏览所有文章</a></p>
                            </div>
                        </div>
                    </div>
                `;
                statsContainer.innerHTML = `找到 <strong>0</strong> 篇与 "${query}" 相关的文章`;
            } else {
                let html = '';
                results.forEach((article, index) => {
                    const highlightedTitle = highlightText(article.title, query);
                    const highlightedExcerpt = highlightText(article.excerpt, query);
                    
                    html += `
                        <div class="col-lg-6">
                            <div class="card border-0 shadow-sm h-100 search-result-item">
                                <div class="card-body">
                                    <div class="d-flex align-items-center mb-3">
                                        <span class="badge bg-primary me-2">${article.category}</span>
                                        <span class="text-muted small">${article.date}</span>
                                    </div>
                                    <h3 class="h5 mb-3">
                                        <a href="${article.url}" class="text-decoration-none">${highlightedTitle}</a>
                                    </h3>
                                    <p class="card-text text-muted mb-3">${highlightedExcerpt}</p>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <small class="text-muted">
                                            <i class="fas fa-eye me-1"></i> ${article.views} 阅读
                                        </small>
                                        <a href="${article.url}" class="btn btn-outline-primary btn-sm">
                                            阅读全文 <i class="fas fa-arrow-right ms-1"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                resultsContainer.innerHTML = html;
                statsContainer.innerHTML = `找到 <strong>${results.length}</strong> 篇与 "${query}" 相关的文章`;
            }
            
            // 滚动到结果区域
            resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 执行搜索
        function performSearch(query) {
            if (!query || query.length < 1) {
                displayResults([], '');
                return;
            }

            const searchQuery = query.toLowerCase().trim();
            const results = blogArticles.filter(article => {
                return (
                    article.title.toLowerCase().includes(searchQuery) ||
                    article.excerpt.toLowerCase().includes(searchQuery) ||
                    article.tags.some(tag => tag.toLowerCase().includes(searchQuery)) ||
                    article.category.toLowerCase().includes(searchQuery) ||
                    article.content && article.content.toLowerCase().includes(searchQuery)
                );
            });

            displayResults(results, searchQuery);
        }

        // 页面加载时执行搜索
        document.addEventListener('DOMContentLoaded', function() {
            const query = getQueryParam('query');
            const searchInput = document.getElementById('searchQuery');
            const searchForm = document.getElementById('searchForm');

            if (query) {
                searchInput.value = query;
                performSearch(query);
            } else {
                // 如果没有搜索词，显示提示
                document.getElementById('searchStats').innerHTML = '输入关键词开始搜索博客文章';
            }

            // 提交表单
            searchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const query = searchInput.value.trim();
                if (query) {
                    // 更新URL
                    const url = new URL(window.location.href.split('?')[0]);
                    url.searchParams.set('query', query);
                    window.history.pushState({}, '', url);
                    performSearch(query);
                }
            });

            // 实时搜索（可选，取消注释启用）
            // searchInput.addEventListener('input', function() {
            //     performSearch(this.value);
            // });
        });
    </script>
